<section class="panel attendance-controls"><div class="panel-heading"><h2>Buổi điểm danh theo lớp</h2><span id="session-status" class="badge">Chưa bắt đầu</span></div><div class="panel-body">
<form id="session-start" class="session-form"><label class="field">Lớp học<select id="attendance-class" required><option value="">Chọn lớp học…</option></select></label><label class="field">Tên buổi<input id="session-name" required maxlength="160" placeholder="Nhập tên buổi học"></label><label class="field">Ngày học<input id="session-date" type="date" required></label><button class="button primary" id="begin-session">Bắt đầu điểm danh</button></form>
<div class="session-actions"><span id="session-info" class="muted">Chọn lớp và tạo buổi trước khi xác nhận Có mặt.</span><button class="button secondary" id="new-session" hidden>Tạo buổi mới</button><button class="button danger" id="finish-session" disabled>Kết thúc điểm danh</button></div><p id="attendance-notice" role="status" aria-live="polite"></p>
</div></section>
